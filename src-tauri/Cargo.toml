[package]
name = "orbit-ai-os"
version = "1.0.0"
description = "Planny - Personal AI Operating System for Tasks, Planning, and Knowledge"
authors = ["Planny Team"]
edition = "2021"

[lib]
name = "orbit_ai_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-notification = "2.0"
tauri-plugin-os = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-store = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
